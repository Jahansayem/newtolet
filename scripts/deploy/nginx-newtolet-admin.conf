# nginx vhost for admin.DOMAIN -> the admin dashboard of the NewTolet static export.
# Installed by admin-subdomain.sh to /etc/nginx/sites-available/newtolet-admin (DOMAIN substituted).
#
# The dashboard is the /admin/ route of the same Next.js build that serves www.DOMAIN, so this
# vhost shares /var/www/newtolet/current (every upload.sh release updates both hosts) and only
# differs in sending "/" to /admin/. Login, assets and the other routes the dashboard links to
# resolve on this host too. Uses the DOMAIN certificate lineage, expanded with -d admin.DOMAIN.

server {
    listen 80;
    listen [::]:80;
    server_name admin.DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.DOMAIN;

    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/newtolet/current;
    index index.html;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The dashboard is not for search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2 text/javascript;

    # The home page of this host is the dashboard.
    location = / {
        return 302 /admin/;
    }

    # /admin is canonical; the old /admin-dashboard alias redirects permanently.
    location ~ ^/admin-dashboard/?$ {
        return 301 /admin/$is_args$args;
    }

    # The service worker script must not be cached by browsers or Cloudflare:
    # a stale copy keeps the old worker in control until the cache entry expires.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(ico|png|jpg|jpeg|gif|webp|avif|svg|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
