# nginx vhost for api.DOMAIN -> self-hosted Supabase gateway (Envoy on 127.0.0.1:8000).
# Installed by domain-cutover.sh / vps-setup.sh to /etc/nginx/sites-available/newtolet-api
# (DOMAIN substituted). Cloudflare proxies api.DOMAIN on 443 but cannot proxy port 8000,
# hence this hop. Uses the DOMAIN certificate lineage, expanded with -d api.DOMAIN.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.DOMAIN;

    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Storage uploads (listing photos). Cloudflare's free plan caps request bodies at 100m.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Realtime websockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        # PostgREST echoes the request URL in Content-Location, so a long
        # ?property_id=in.(...) lookup returns response headers above nginx's
        # default 4k buffer ("upstream sent too big header" -> 502). Requests
        # are capped at 8k by large_client_header_buffers, so 16k is enough.
        # nginx requires proxy_buffers / proxy_busy_buffers_size to be raised
        # with it, even though proxy_buffering is off.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
