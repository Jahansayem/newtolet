# Security headers for www.newtolet.com. Installed to /etc/nginx/snippets/newtolet-security-headers.conf
# and included in the server block AND in every location that sets its own add_header
# (nginx drops inherited add_header directives as soon as a location defines one).

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
# script-src needs 'unsafe-inline': the Next.js static export bootstraps with inline scripts.
# img-src allows any https host because older listings reference images on several hosts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.newtolet.com wss://api.newtolet.com; frame-src https://www.openstreetmap.org https://www.google.com https://maps.google.com; worker-src 'self'; manifest-src 'self'; form-action 'self' https://api.newtolet.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
