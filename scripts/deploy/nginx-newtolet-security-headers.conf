# Security headers for www.newtolet.com. Installed to /etc/nginx/snippets/newtolet-security-headers.conf
# and included in the server block AND in every location that sets its own add_header
# (nginx drops inherited add_header directives as soon as a location defines one).

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
# script-src needs 'unsafe-inline': the Next.js static export bootstraps with inline scripts.
# cloudflareinsights: Cloudflare injects its Web Analytics beacon into pages.
# googletagmanager / google-analytics: GA4 loads gtag.js and sends hits to regional collect hosts.
# The bare analytics.google.com is listed separately because *.analytics.google.com only matches
# subdomains. www.google.com and *.g.doubleclick.net are the Google Signals collect hosts.
# img-src allows any https host because older listings reference images on several hosts.
# Adsterra banner (src/Component/Home/Ads.jsx): bagelstoppage.com serves invoke.js, which opens the ad
# iframe and sends XHRs to workdeadlinededicate.com and a stats XHR to protrafficinspector.com.
# Adsterra rotates these domains: if the banner goes blank, check the console for a CSP violation
# and replace the hosts here (and the script URL in Ads.jsx) with the ones in the new invoke.js.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://*.googletagmanager.com https://bagelstoppage.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.newtolet.com wss://api.newtolet.com https://cloudflareinsights.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://analytics.google.com https://www.google.com https://*.g.doubleclick.net https://workdeadlinededicate.com https://protrafficinspector.com; frame-src https://www.openstreetmap.org https://www.google.com https://maps.google.com https://workdeadlinededicate.com; worker-src 'self'; manifest-src 'self'; form-action 'self' https://api.newtolet.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
