# nginx site for the NewTolet Next.js static export (output: 'export', trailingSlash: true).
# Installed by vps-setup.sh to /etc/nginx/sites-available/newtolet.
# SERVER_NAME is replaced by vps-setup.sh ("_" when serving by IP only).
# Needs /etc/nginx/snippets/newtolet-security-headers.conf (nginx-newtolet-security-headers.conf).

# Short cache for the sitemap Edge Function response.
proxy_cache_path /var/cache/nginx/newtolet-sitemap levels=1 keys_zone=newtolet_sitemap:1m max_size=20m inactive=2h use_temp_path=off;
# Per-listing SEO fragments from the listing-seo Edge Function (two small entries per listing).
proxy_cache_path /var/cache/nginx/newtolet-seo levels=1:2 keys_zone=newtolet_seo:10m max_size=200m inactive=1h use_temp_path=off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name SERVER_NAME;

    root /var/www/newtolet/current;
    index index.html;

    # One canonical host: https://www.newtolet.com. The apex permanently redirects.
    if ($host = newtolet.com) {
        return 301 https://www.newtolet.com$request_uri;
    }

    # Nothing is uploaded through nginx; files go straight to Supabase Storage.
    client_max_body_size 1m;

    include /etc/nginx/snippets/newtolet-security-headers.conf;

    # Next 16 segment prefetches request "<dir>/__next.<group>.<seg>.<seg>.txt", but the static
    # export writes them as nested files "<dir>/__next.<group>/<seg>/<seg>.txt". Map one onto the
    # other so client navigations do not 404 their prefetch and fall back to a full fetch.
    rewrite "^(.*)/__next\.([^./]+)\.([^./]+)\.([^./]+)\.([^./]+)\.([^./]+)\.txt$" $1/__next.$2/$3/$4/$5/$6.txt last;
    rewrite "^(.*)/__next\.([^./]+)\.([^./]+)\.([^./]+)\.([^./]+)\.txt$" $1/__next.$2/$3/$4/$5.txt last;
    rewrite "^(.*)/__next\.([^./]+)\.([^./]+)\.([^./]+)\.txt$" $1/__next.$2/$3/$4.txt last;
    rewrite "^(.*)/__next\.(![^./]+)\.([^./]+)\.txt$" $1/__next.$2/$3.txt last;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2 text/javascript;

    # The service worker script must not be cached by browsers or Cloudflare:
    # a stale copy keeps the old worker in control until the cache entry expires.
    location = /sw.js {
        include /etc/nginx/snippets/newtolet-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Live sitemap built by the `sitemap` Edge Function from the current approved listings.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/functions/v1/sitemap;
        # The Supabase gateway answers HTTP/1.0 with 426 Upgrade Required.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache newtolet_sitemap;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating;
        proxy_hide_header Cache-Control;
        include /etc/nginx/snippets/newtolet-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Listing pages: one static file serves every ?id=. Its SSI includes (added at build time by
    # scripts/listing-ssi.mjs) pull the per-listing <title>, description, canonical, Open Graph,
    # JSON-LD and an H1 block from the listing-seo Edge Function. When the function fails, the
    # includes fall back to the page's generic tags. /listdetails/ reaches this location through
    # the index internal redirect, with its query string intact.
    location = /listdetails/index.html {
        ssi on;
    }

    location ^~ /__seo/ {
        internal;
        proxy_pass http://127.0.0.1:8000/functions/v1/listing-seo/;
        # The Supabase gateway answers HTTP/1.0 with 426 Upgrade Required.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # SSI cannot splice a compressed subrequest body.
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_cache newtolet_seo;
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    # Customer Orders API for the AI agents and admin tools:
    #   https://www.newtolet.com/api/v1/orders...  ->  the customer-orders Edge Function.
    # Callers must use the www host: the apex redirect above turns a POST into a GET.
    # "^~" keeps the static-file regex locations below from ever matching an API path.
    # No add_header here, so the server-level security headers are inherited; the
    # function itself sends "Cache-Control: private, no-store".
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8000/functions/v1/customer-orders/;
        # The Supabase gateway answers HTTP/1.0 with 426 Upgrade Required.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
        client_max_body_size 128k;
    }

    # Hashed build assets never change: cache for a year.
    location /_next/static/ {
        expires 1y;
        include /etc/nginx/snippets/newtolet-security-headers.conf;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Other static files (images, fonts, icons) get a shorter cache.
    location ~* \.(ico|png|jpg|jpeg|gif|webp|avif|svg|woff2?|ttf)$ {
        expires 7d;
        include /etc/nginx/snippets/newtolet-security-headers.conf;
        add_header Cache-Control "public";
        access_log off;
    }

    # /admin is the canonical admin route; the old /admin-dashboard alias is a
    # permanent redirect (the exported page also redirects client-side).
    location ~ ^/admin-dashboard/?$ {
        return 301 /admin/$is_args$args;
    }

    # Common guessed or legacy URLs -> the real routes, so links from other sites,
    # old bookmarks and crawlers never land on a 404.
    location ~ ^/(add-property|post-ad|post-property|add-listing)/?$      { return 301 /addproperty/; }
    location ~ ^/(about-us|aboutus)/?$                                    { return 301 /about/; }
    location ~ ^/(contact-us|contactus)/?$                                { return 301 /contact/; }
    location ~ ^/(terms-of-service|terms-and-conditions|tos)/?$          { return 301 /terms/; }
    location ~ ^/(privacy-policy)/?$                                      { return 301 /privacy/; }
    location ~ ^/(refund-policy)/?$                                       { return 301 /refund/; }
    location ~ ^/(signup|sign-up|register)/?$                             { return 301 /registration/$is_args$args; }
    location ~ ^/(signin|sign-in)/?$                                      { return 301 /login/$is_args$args; }
    location ~ ^/(search|properties|listings|property-listing|propertylist)/?$ { return 301 /bd/property-listing/$is_args$args; }
    location ~ ^/(earn-money)/?$                                          { return 301 /earnmoney/; }
    location ~ ^/(job-list|jobs|careers)/?$                               { return 301 /career/; }
    location ~ ^/(articles|blog)/?$                                       { return 301 /article/; }
    location ~ ^/(favourites|favorites|saved-properties)/?$               { return 301 /saved/; }

    # trailingSlash: true means /route/ -> /route/index.html.
    # End with =404 (not /404.html) so unknown routes get a real 404 status;
    # error_page below then serves the exported 404 page as the body.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/newtolet-security-headers.conf;
    }

    # Deny dotfiles except ACME challenges (used by certbot later).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
